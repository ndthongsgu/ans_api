[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
# timezone = UTC

# max length of characters to apply to the
# migration filenames and identifiers.
# revision_environment = false

# set to 'true' to run the environment file within a transaction as well
# as with its own transaction; this is useful if the environmental setup
# must run in the same transaction as the migration, e.g. create views.
# transactional_ddl = false

# set to 'true' to use batch mode for SQLite migrations
# batch_mode = false

# set to 'true' to warn on empty revisions
# warn_on_empty_revisions = false

# set to 'true' to enable sql mode
# sql_mode = false

# set to 'true' to allow alembic to automatically generate revision files
# in offline mode
# offline_mode = false

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts. See the documentation for further
# detail and examples

# format using "pep8" or "black" - "pep8" checks only, "black" formats
# hooks = pep8,black

# pep8_args = --select=E,W --max-line-length=79

# black_args = -l 79

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
formatter = generic
args = (sys.stderr,)

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
